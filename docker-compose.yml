version: '3.9'

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/app.db:/app/app.db
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=sqlite:///./app.db
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend
